
name: Upbit 15 public market snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "3 * * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check schedule trigger
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Cron: ${{ github.event.schedule }}"
          date -u
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get completed bars and public tickers
        run: python collect_upbit.py
      - name: Publish fresh snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/latest.md
          if git diff --cached --quiet; then
            echo "No market snapshot changes"
            exit 0
          fi
          git commit -m "Refresh public Upbit 15-market data"
          git push
